<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- font one-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Gelasio:ital,wght@0,400..700;1,400..700&display=swap"
      rel="stylesheet" />
    <link rel="stylesheet" href="./style.css" />
  </head>

  <body>
    <!--NAV BAR START-->
    <div class="navbar">
      <div class="dashname">
        <h1 class="noto-sans-display-h1">Dashboard</h1>
      </div>

      <div class="pagename">
        <div class="page1">
          <i class="fa-solid fa-tv"></i>
          <h2 class="noto-sans-display-page">Overview</h2>
        </div>

        <div class="page2">
          <i class="fa-solid fa-square-poll-vertical"></i>
          <h2 class="noto-sans-display-page">Analytics</h2>
        </div>

        <div class="page3">
          <i class="fa-solid fa-shuffle"></i>
          <h2 class="noto-sans-display-page">Flowchart</h2>
        </div>
      </div>

      <div class="accountname">
        <i class="fa-solid fa-user"></i>
        <h3 class="noto-sans-display-h3">Account Name</h3>
      </div>
    </div>
    <!-- NAV BAR END -->

    <!-- BLOCKS START-->
    <div class="main">
      <header class="header">
        <!-- <div class="top_header"> -->
        <h2 class="noto-sans-display-h1">Welcome to the Dashboard</h2>
        <!-- </div> -->
      </header>

      <div class="blocks">
        <div class="block1">
          <div class="block1-title">
            <h4 class="noto-sans-display-blocks">Block 1</h4>
            <!--<h4 class="block1-content"></h4>-->
          </div>
        </div>

        <div class="block2">
          <div class="block2-title">
            <h4 class="noto-sans-display-blocks">Block 2</h4>
            <!-- <h4 class="block2-content"></h4> -->
          </div>
        </div>

        <div class="block3">
          <div class="block3-title">
            <h4 class="noto-sans-display-blocks">Block 3</h4>
            <!--<h4 class="block3-content"></h4> -->
          </div>
        </div>

        <div class="block4">
          <div class="block4-title">
            <h4 class="noto-sans-display-blocks">Block 4</h4>
            <!-- <h4 class="block4-content"></h4> -->
          </div>
        </div>
      </div>
    </div>

    <footer></footer>

    <!-- Script for icons-->
    <script
      src="https://kit.fontawesome.com/3000704a08.js"
      crossorigin="anonymous"></script>
  </body>
</html>
